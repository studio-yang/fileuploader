# FileFlow — Fly.io 部署設定
# 用途：Vercel 之外的備援部署平台（取代原先評估的 Koyeb）。
# ⚠️ 改 app 名稱時，下面三處的網址要一起改（app / build.args / env）。
# ⚠️ 不要用網頁版 Launch UI 或重跑 fly launch —— 它會覆寫本檔並洗掉 [build.args]。

app = 'tdoc-fileflow'
primary_region = 'nrt'

[build]
  # NEXT_PUBLIC_* 會在 next build 階段被內嵌進 bundle，
  # 因此必須用 build arg 於「建置時」提供，不能只靠執行期的 env / secrets。
  [build.args]
    NEXT_PUBLIC_APP_URL = 'https://tdoc-fileflow.fly.dev'

[env]
  # 執行期也給一份：伺服器端（封鎖警示信的動作按鈕連結）讀的是這個值。
  NEXT_PUBLIC_APP_URL = 'https://tdoc-fileflow.fly.dev'

[http_service]
  # 需與 Dockerfile 的 EXPOSE / 啟動 port 一致
  internal_port = 8080
  force_https = true

  # auto-stop：閒置自動關機以省費用，有請求時由 fly-proxy 喚醒。
  # ⚠️ 2026-08-06 首次部署時曾因此出現 502 死結而改成常駐，但當時同一輪也修了 IPv6 綁定，
  #    兩件事沒有分開驗證 —— 死結的真因很可能是 IPv6 而非 auto-stop。此處重新啟用以驗證。
  # ⚠️ 代價：冷啟動約 33 秒（開機 25s + Next.js 8s），使用者體感是「點進去空等」。
  #    若同仁回報開站很慢，把下面兩行改回 'off' / 1 即可復原。
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/login'

[[vm]]
  # 實測 app 閒置吃 132MB（512MB 機器上 available 308MB），降到 256MB 後餘裕約 70MB。
  # ⚠️ 很緊。若 fly logs 出現 OOM / 機器無故重啟，改回 512 即可。
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
