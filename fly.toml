# FileFlow — Fly.io 部署設定
# 用途：Vercel 之外的備援部署平台（取代原先評估的 Koyeb）。
# ⚠️ 改 app 名稱時，下面三處的網址要一起改（app / build.args / env）。
app = "chb-fileflow"
primary_region = "nrt"

[build]
  # NEXT_PUBLIC_* 會在 next build 階段被內嵌進 bundle，
  # 因此必須用 build arg 於「建置時」提供，不能只靠執行期的 secrets。
  [build.args]
    NEXT_PUBLIC_APP_URL = "https://chb-fileflow.fly.dev"

[env]
  # 執行期也給一份：伺服器端（封鎖警示信的動作按鈕連結）讀的是這個值。
  NEXT_PUBLIC_APP_URL = "https://chb-fileflow.fly.dev"

[http_service]
  # 需與 Dockerfile 的 EXPOSE / 啟動 port 一致
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
