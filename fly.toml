# FileFlow — Fly.io 部署設定
# 用途：Vercel 之外的備援部署平台（取代原先評估的 Koyeb）。
# ⚠️ 改 app 名稱時，下面三處的網址要一起改（app / build.args / env）。
# ⚠️ 不要用網頁版 Launch UI 或重跑 fly launch —— 它會覆寫本檔並洗掉 [build.args]。

app = 'tdoc-fileflow'
primary_region = 'nrt'

[build]
  # NEXT_PUBLIC_* 會在 next build 階段被內嵌進 bundle，
  # 因此必須用 build arg 於「建置時」提供，不能只靠執行期的 env / secrets。
  [build.args]
    NEXT_PUBLIC_APP_URL = 'https://tdoc-fileflow.fly.dev'

[env]
  # 執行期也給一份：伺服器端（封鎖警示信的動作按鈕連結）讀的是這個值。
  NEXT_PUBLIC_APP_URL = 'https://tdoc-fileflow.fly.dev'

[http_service]
  # 需與 Dockerfile 的 EXPOSE / 啟動 port 一致
  internal_port = 8080
  force_https = true

  # ⚠️ 不可改回 auto-stop：機器停掉時 health check 會回報 "the machine hasn't started"，
  # 永遠到不了 passing，fly-proxy 就拒絕轉送流量（502/503）；而冷啟動約需 33 秒
  # （開機 25s + Next.js 8s）也超過 proxy 的等待上限。常駐是目前唯一穩定的組態。
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/login'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
